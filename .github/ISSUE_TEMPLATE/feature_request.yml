name: Feature request
description: Propose a Tower Browser improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem without proposing implementation first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Privacy, security, and compatibility impact
    validations:
      required: true
