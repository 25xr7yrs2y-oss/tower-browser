name: Windows tests

on:
  push:
  pull_request:

jobs:
  powershell-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build native Windows application
        shell: powershell
        run: .\Build.ps1
      - name: Smoke start native Windows application
        shell: powershell
        run: |
          $process = Start-Process -FilePath .\app\PrivacyBrowser.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "PrivacyBrowser.exe exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            $process.Dispose()
          }
      - name: Validate locked policy
        shell: powershell
        run: .\tests\Test-Configuration.ps1
      - name: Validate launcher invariants
        shell: powershell
        run: .\tests\Test-Launcher.ps1
      - name: Validate native architecture invariants
        shell: powershell
        run: .\tests\Test-NativeArchitecture.ps1
      - name: Validate navigation architecture
        shell: powershell
        run: .\tests\Test-NavigationArchitecture.ps1
      - name: Validate backend controls and wallet workflow
        shell: powershell
        run: .\tests\Test-BackendControls.ps1
      - name: Validate hosted payment security invariants
        shell: powershell
        run: .\tests\Test-PaymentSecurity.ps1
      - name: Validate backend deadlines and connection reconciliation
        shell: powershell
        run: dotnet run --project .\tests\PrivacyBrowser.BackendController.Tests\PrivacyBrowser.BackendController.Tests.csproj --configuration Release
      - name: Validate product and security hardening
        shell: powershell
        run: .\tests\Test-ProductHardening.ps1
      - name: Validate version and WPF/embedded icons
        shell: powershell
        run: .\tests\Test-ReleaseMetadata.ps1
      - name: Validate evidence integrity
        shell: powershell
        run: .\tests\Test-Evidence.ps1
      - name: Publish self-contained QA application
        shell: powershell
        run: |
          dotnet publish .\src\PrivacyBrowser.App\PrivacyBrowser.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output qa-app `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser-1.0.8-windows-x64-app
          path: app/
          if-no-files-found: error
      - name: Upload self-contained QA application
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyBrowser-1.0.8-windows-x64-self-contained
          path: qa-app/
          if-no-files-found: error
