name: Windows tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  powershell-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content .\src\PrivacyBrowser.App\PrivacyBrowser.App.csproj -Raw)
          "version=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Build native Windows application
        shell: pwsh
        run: .\Build.ps1
      - name: Smoke start native Windows application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\app\TowerBrowser.exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "TowerBrowser.exe exited during startup with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
            $process.Dispose()
          }
      - name: Run repository validation scripts
        shell: pwsh
        run: |
          .\tests\Test-Configuration.ps1
          .\tests\Test-Launcher.ps1
          .\tests\Test-NativeArchitecture.ps1
          .\tests\Test-NavigationArchitecture.ps1
          .\tests\Test-BackendControls.ps1
          .\tests\Test-PaymentSecurity.ps1
          dotnet run --project .\tests\PrivacyBrowser.BackendController.Tests\PrivacyBrowser.BackendController.Tests.csproj --configuration Release
          .\tests\Test-ProductHardening.ps1
          .\tests\Test-ReleaseMetadata.ps1
          .\tests\Test-Evidence.ps1
      - name: Publish self-contained QA application
        shell: pwsh
        run: |
          dotnet publish .\src\PrivacyBrowser.App\PrivacyBrowser.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output qa-app `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: TowerBrowser-${{ steps.version.outputs.version }}-windows-x64-app
          path: app/
          if-no-files-found: error
      - name: Upload self-contained QA application
        uses: actions/upload-artifact@v4
        with:
          name: TowerBrowser-${{ steps.version.outputs.version }}-windows-x64-self-contained
          path: qa-app/
          if-no-files-found: error
