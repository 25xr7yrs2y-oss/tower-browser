name: Tower Browser release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: tower-browser-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release tag and main ancestry
        id: release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tag must be strict SemVer vX.Y.Z: $tag"
          }
          $version = $tag.Substring(1)
          $project = [xml](Get-Content .\src\PrivacyBrowser.App\PrivacyBrowser.App.csproj -Raw)
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw "Tag $tag does not match application version $($project.Project.PropertyGroup.Version)."
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not reachable from origin/main." }
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) { throw "Checked-out commit does not match $tag." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=TowerBrowser-$version-release-assets" >> $env:GITHUB_OUTPUT
      - name: Build native Windows application
        shell: pwsh
        run: .\Build.ps1
      - name: Run Windows validation suite
        shell: pwsh
        run: |
          .\tests\Test-Configuration.ps1
          .\tests\Test-Launcher.ps1
          .\tests\Test-NativeArchitecture.ps1
          .\tests\Test-NavigationArchitecture.ps1
          .\tests\Test-BackendControls.ps1
          .\tests\Test-PaymentSecurity.ps1
          dotnet run --project .\tests\PrivacyBrowser.BackendController.Tests\PrivacyBrowser.BackendController.Tests.csproj --configuration Release
          .\tests\Test-ProductHardening.ps1
          .\tests\Test-ReleaseMetadata.ps1
          .\tests\Test-Evidence.ps1
      - name: Build complete portable release
        shell: pwsh
        env:
          MYST_RELEASE_TOKEN: ${{ secrets.MYST_RELEASE_TOKEN }}
        run: .\Package-Release.ps1
      - name: Verify release package and checksums
        shell: pwsh
        run: .\tests\Test-ReleasePackage.ps1
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-test-package.outputs.artifact }}
          path: release
      - name: Verify expected immutable assets
        env:
          VERSION: ${{ needs.build-test-package.outputs.version }}
        run: |
          set -euo pipefail
          test -s "release/TowerBrowser-$VERSION-windows-x64-portable.zip"
          test -s "release/TowerBrowser-$VERSION-myst-lmprove-source-7944a4c.tar.gz"
          test -s "release/TowerBrowser-$VERSION-SHA256SUMS.txt"
          cd release
          sha256sum --check "TowerBrowser-$VERSION-SHA256SUMS.txt"
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "Tower Browser v$VERSION" \
            --notes-file "docs/RELEASE_NOTES_$VERSION.md" \
            --latest
