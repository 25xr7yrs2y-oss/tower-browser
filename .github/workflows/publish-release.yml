name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Release package workflow run ID
        required: true
        type: string
      tag:
        description: Existing release tag
        required: true
        default: v1.0.9
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Download exact verified tag-build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "v1.0.9"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)" = "Release package"
          test "$(gh run view "$RUN_ID" --json headSha --jq .headSha)" = "$(git rev-parse HEAD)"
          gh run download "$RUN_ID" --name PrivacyBrowser-1.0.9-release-assets --dir release
      - name: Confirm expected release files
        run: |
          test -s release/PrivacyBrowser-1.0.9-windows-x64-portable.zip
          test -s release/PrivacyBrowser-1.0.9-myst-lmprove-source-7944a4c.tar.gz
          test -s release/PrivacyBrowser-1.0.9-SHA256SUMS.txt
          cd release
          sha256sum --check PrivacyBrowser-1.0.9-SHA256SUMS.txt
      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable release assets." >&2
            exit 1
          fi
          gh release create "$TAG" release/* --verify-tag --title "Privacy Browser Prototype Demo v1.0.9" --notes-file docs/RELEASE_NOTES_1.0.9.md --prerelease
